<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neumorphic Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="top"><button class="theme" id="theme" aria-label="Toggle light and dark theme">◐</button></div>
  <div class="display" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="clear" data-a="clear">AC</button>
    <button class="op" data-a="sign">±</button>
    <button class="op" data-a="percent">%</button>
    <button class="op" data-a="op" data-v="÷">÷</button>
    <button data-a="num" data-v="7">7</button>
    <button data-a="num" data-v="8">8</button>
    <button data-a="num" data-v="9">9</button>
    <button class="op" data-a="op" data-v="×">×</button>
    <button data-a="num" data-v="4">4</button>
    <button data-a="num" data-v="5">5</button>
    <button data-a="num" data-v="6">6</button>
    <button class="op" data-a="op" data-v="−">−</button>
    <button data-a="num" data-v="1">1</button>
    <button data-a="num" data-v="2">2</button>
    <button data-a="num" data-v="3">3</button>
    <button class="op" data-a="op" data-v="+">+</button>
    <button data-a="num" data-v="0">0</button>
    <button data-a="dot">.</button>
    <button data-a="back" aria-label="Backspace">⌫</button>
    <button class="op" data-a="eq">=</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
